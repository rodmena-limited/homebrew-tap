name: Update formulae from PyPI

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # `outputs.updates`, not the exit code. Keying off the exit code
      # conflated "there is work to do" with "this script fell over": a PyPI
      # outage returns 1 too, and the workflow would then apply nothing and
      # open an empty pull request.
      - name: Check for available updates
        id: check
        continue-on-error: true
        run: python3 scripts/update.py --dry-run

      - name: Apply updates
        if: steps.check.outputs.updates == 'true'
        run: python3 scripts/update.py

      - name: Create Pull Request
        if: steps.check.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update formulae to latest PyPI versions"
          branch: auto/update-formulae
          delete-branch: true
          base: main
          title: "chore: update formulae to latest PyPI versions"
          body: |
            Automated update triggered by the scheduled CI workflow.

            Changes applied by `scripts/update.py` — each formula's `url`
            and `sha256` updated to the latest sdist published on PyPI.

            To review: `git diff main..auto/update-formulae`

            If this PR is merged, run `brew update && brew upgrade` to
            pick up the new versions.
          labels: |
            automated
            dependencies

      # The check step is allowed to fail because exit 1 is how it says
      # "updates available". That tolerance must not extend to the script
      # actually breaking, or a tap that cannot be checked at all reports a
      # green run.
      - name: Fail if the update check errored
        if: steps.check.outputs.errors != '0' && steps.check.outputs.errors != ''
        run: |
          echo "scripts/update.py reported ${{ steps.check.outputs.errors }} error(s)" >&2
          exit 1
